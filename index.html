<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6c4ee3" />
    <title>Teng Games</title>
    <meta name="description" content="Fun learning games, starting with Hoot's Chess Club." />
    <link rel="icon" href="/pieces/wN.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/site/site.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="logo">Teng<span>Games</span></div>
    </header>
    <main>
      <h1>Pick a game!</h1>
      <div class="games">
        <a class="game-card chess" href="/chess/">
          <div class="art"><img src="/pieces/wN.svg" alt="" /><img src="/pieces/bK.svg" alt="" /></div>
          <h2>Hoot's Chess Club</h2>
          <p>Play bots, learn openings and gambits, and solve puzzles.</p>
          <span class="play-btn">Play ▶</span>
        </a>
        <div class="game-card soon">
          <div class="art">🎲</div>
          <h2>More games coming…</h2>
          <p>Watch this space!</p>
        </div>
      </div>
    </main>
    <footer>© Teng Games</footer>
  </body>
</html>
