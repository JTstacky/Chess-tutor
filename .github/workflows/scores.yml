name: Deploy high scores

# Deploys scores/ (the high-score tables) to Cloudflare Workers. Uses the same two repository
# secrets as the multiplayer relay; see relay/README.md for setting them up.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scores/**']

permissions:
  contents: read

concurrency:
  group: scores

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set, so the scores worker was not deployed. See relay/README.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Deploy the Worker
        if: steps.secrets.outputs.ok == 'true'
        working-directory: scores
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then echo "::error::Couldn't find the scores worker's workers.dev address in the deploy output."; exit 1; fi
          echo "SCORES_URL=$url" >> "$GITHUB_ENV"
      - name: Check it answers
        if: steps.secrets.outputs.ok == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS "$SCORES_URL/health" && exit 0
            sleep 5
          done
          echo "::error::The scores worker did not answer /health"; exit 1
