# Teng Games multiplayer relay (Cloudflare Worker + Durable Objects, free plan).
# Deployed by .github/workflows/relay.yml. See relay/README.md.
name = "tenggames-relay"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
HEROES_ENABLED = "false"
# Pages allowed to use the relay (comma separated; "*" allows any).
ALLOWED_ORIGINS = "https://tenggames.com.au,https://www.tenggames.com.au,https://jtstacky.github.io,http://localhost,http://127.0.0.1"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[durable_objects.bindings]]
name = "INVITES"
class_name = "InviteRoom"

[[migrations]]
tag = "v2-invites"
new_sqlite_classes = ["InviteRoom"]

[[durable_objects.bindings]]
name = "HEROES_JOBS"
class_name = "HeroesJobs"

[[migrations]]
tag = "v3-nonplayer-server"
new_sqlite_classes = ["HeroesJobs"]

# Existing private original-data namespace; only the non-player service route
# can read it. Player data routes and full-profile checks remain unchanged.
[[kv_namespaces]]
binding = "HEROES_ORIGINALS"
id = "d2ff74421a464a83a3d03849bdb29f76"

# Authenticate directly through the existing account Worker. A public Worker
# fetch to another workers.dev service is not a supported same-account hop.
[[services]]
binding = "ACCOUNTS"
service = "ev-online-api"

# Non-player native engine, woken when a Heroes player reconnects.
[[services]]
binding = "HEROES_SERVER"
service = "tenggames-heroes-server"


[[durable_objects.bindings]]
name = "ARCADES"
class_name = "ArcadeRoom"

[[migrations]]
tag = "v4-arcade-coop"
new_sqlite_classes = ["ArcadeRoom"]
