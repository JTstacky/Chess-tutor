<!doctype html>
<html lang="en">
<head>
<script>window.ZELIARD_BUILD = '20261003T0935-6be7ecc';</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zeliard — Remastered</title>
<meta name="description" content="A browser remake of Game Arts' 1987 action RPG Zeliard, with remastered art and online co-op.">
<link rel="icon" href="art/ui/icon.png">
<!-- Added to the home screen it runs fullscreen and landscape, like an app. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="art/ui/icon-192.png">
<meta name="theme-color" content="#07060b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  @font-face { font-family: 'Beliards'; src: url('fonts/PixelifySans.ttf') format('truetype'); font-display: block; }
  html, body { margin: 0; height: 100%; background: #07060b; overflow: hidden; touch-action: none; }
  body { display: grid; place-items: center; }
  #screen { image-rendering: pixelated; image-rendering: crisp-edges; background: #000; outline: none; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #d8c48a; font: 16px 'Beliards', monospace; letter-spacing: 2px; }
  #boot.gone { display: none; }
  /* Touch controls (src/ui/touch.js sets --d, the d-pad size, and the positions). */
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; --d: 120px;
    --rim: #c9a55a; --rim2: #5a4526; --glass: rgba(20, 14, 34, .78); --ink: #f4ead0;
    font-family: 'Beliards', monospace; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #touch.on { display: block; }
  #touch > div { position: absolute; pointer-events: auto; touch-action: none; }
  #touch.overlay .tc-dpad, #touch.overlay .tc-btn, #touch.overlay .tc-pill { opacity: .62; }
  .tc-dpad { border-radius: 50%; background: radial-gradient(circle at 50% 45%, rgba(60, 46, 80, .85), var(--glass) 70%);
    box-shadow: 0 0 0 2px var(--rim2), 0 0 0 4px rgba(201, 165, 90, .55), 0 6px 18px rgba(0, 0, 0, .6), inset 0 2px 10px rgba(255, 230, 170, .08); }
  .tc-arrow { position: absolute; width: 0; height: 0; border: calc(var(--d) * .085) solid transparent; opacity: .55; transition: opacity .06s; }
  .tc-arrow.up { left: 50%; top: 7%; transform: translateX(-50%); border-bottom: calc(var(--d) * .11) solid var(--rim); border-top-width: 0; }
  .tc-arrow.down { left: 50%; bottom: 7%; transform: translateX(-50%); border-top: calc(var(--d) * .11) solid var(--rim); border-bottom-width: 0; }
  .tc-arrow.left { top: 50%; left: 7%; transform: translateY(-50%); border-right: calc(var(--d) * .11) solid var(--rim); border-left-width: 0; }
  .tc-arrow.right { top: 50%; right: 7%; transform: translateY(-50%); border-left: calc(var(--d) * .11) solid var(--rim); border-right-width: 0; }
  .tc-knob { position: absolute; left: 50%; top: 50%; width: 40%; height: 40%; margin: -20% 0 0 -20%; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #f6dc96, #c9a55a 45%, #6b5128 100%);
    box-shadow: 0 3px 8px rgba(0, 0, 0, .55), inset 0 -3px 6px rgba(0, 0, 0, .35), inset 0 2px 3px rgba(255, 255, 255, .35); }
  .tc-cluster { pointer-events: none !important; }
  .tc-btn { position: absolute; width: 47%; height: 47%; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--ink); pointer-events: auto; touch-action: none; transition: transform .05s, filter .05s;
    box-shadow: 0 0 0 2px var(--rim2), 0 0 0 3.5px var(--rim), 0 5px 12px rgba(0, 0, 0, .6), inset 0 2px 6px rgba(255, 255, 255, .25), inset 0 -4px 8px rgba(0, 0, 0, .35); }
  .tc-btn svg { width: 46%; height: 46%; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .6)); }
  .tc-btn span { font-size: max(9px, calc(var(--d) * .085)); letter-spacing: .5px; margin-top: 1px; text-shadow: 0 1px 2px #000; }
  .tc-btn.attack { left: 0; top: 34%; background: radial-gradient(circle at 40% 30%, #e0645a, #a8231d 60%, #5c0f0c); }
  .tc-btn.jump { right: 0; bottom: 0; background: radial-gradient(circle at 40% 30%, #6cc6e8, #2369a8 60%, #0f2f5c); }
  .tc-btn.magic { right: 0; top: 0; background: radial-gradient(circle at 40% 30%, #c6a0ff, #7044c0 60%, #301a5c); }
  .tc-pill { height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; color: var(--ink); font-size: 14px;
    background: var(--glass); box-shadow: 0 0 0 1.5px var(--rim2), 0 0 0 3px rgba(201, 165, 90, .6), 0 4px 10px rgba(0, 0, 0, .5); }
  .tc-pill.fs { display: none; font-size: 12px; }
  #touch.show-fs .tc-pill.fs { display: flex; }
  .tc-corners { width: 10px; height: 10px; margin-right: 7px; border: 2px solid var(--rim); clip-path: polygon(0 0, 40% 0, 40% 15%, 60% 15%, 60% 0, 100% 0, 100% 40%, 85% 40%, 85% 60%, 100% 60%, 100% 100%, 60% 100%, 60% 85%, 40% 85%, 40% 100%, 0 100%, 0 60%, 15% 60%, 15% 40%, 0 40%); }
  .tc-bars { width: 4px; height: 12px; margin-right: 8px; border-left: 4px solid var(--rim); border-right: 4px solid var(--rim); }
  .tc-btn.held, .tc-pill.held { transform: scale(.92); filter: brightness(1.35); }
  .tc-pill.held { background: rgba(201, 165, 90, .45); }
  .tc-arrow.held { opacity: 1 !important; filter: drop-shadow(0 0 4px #ffe39a); }
  .tc-text { position: fixed; left: 50%; top: 8px; transform: translateX(-50%); width: min(70vw, 360px); height: 40px; box-sizing: border-box;
    padding: 0 14px; border-radius: 10px; border: 2px solid var(--rim); background: #120c1e; color: var(--ink); font: 20px 'Beliards', monospace; text-align: center;
    opacity: 0; pointer-events: none; outline: none; }
  #touch.typing .tc-text { opacity: 1; pointer-events: auto; }
  @media (orientation: portrait) { #touch.on::after { content: 'Turn your phone sideways to play'; position: fixed; left: 0; right: 0; top: 12px;
    text-align: center; color: #f2c85b; font-size: 16px; text-shadow: 0 1px 3px #000; } }
</style>
</head>
<body>
<canvas id="screen" width="960" height="540" tabindex="0" aria-label="Zeliard game screen"></canvas>
<div id="boot">LOADING…</div>
<div id="touch"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
