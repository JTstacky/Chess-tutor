<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Beliards — a Zeliard remake</title>
<meta name="description" content="A browser remake of Game Arts' 1987 action RPG Zeliard, with remastered art and online co-op.">
<link rel="icon" href="art/ui/icon.png">
<style>
  @font-face { font-family: 'Beliards'; src: url('fonts/PixelifySans.ttf') format('truetype'); font-display: block; }
  html, body { margin: 0; height: 100%; background: #07060b; overflow: hidden; touch-action: none; }
  body { display: grid; place-items: center; }
  #screen { image-rendering: pixelated; image-rendering: crisp-edges; background: #000; outline: none; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #d8c48a; font: 16px 'Beliards', monospace; letter-spacing: 2px; }
  #boot.gone { display: none; }
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; }
  #touch.on { display: block; }
  #touch .pad { position: absolute; pointer-events: auto; width: 64px; height: 64px; border-radius: 50%; background: rgba(255,240,200,.14); border: 2px solid rgba(255,240,200,.35); color: #fff6; font: 14px 'Beliards', monospace; display: grid; place-items: center; user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<canvas id="screen" width="960" height="540" tabindex="0" aria-label="Beliards game screen"></canvas>
<div id="boot">LOADING…</div>
<div id="touch"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
