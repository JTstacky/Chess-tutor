<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14101c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Revenge of the Demon Dragon</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%90%89%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="mode-title">
    <div id="view">
      <canvas id="c"></canvas>
      <div class="bar" id="bar-top"></div>
      <div class="bar" id="bar-bot"></div>
      <div id="labels"></div>
      <div id="flash"></div>

      <div id="hud">
        <div id="hearts"></div>
        <div id="lvl"></div>
      </div>
      <button id="relic" type="button" aria-label="Switch relic element"></button>
      <button id="mute" type="button" aria-label="Toggle sound">🔊</button>

      <div id="bossbar">
        <div id="bossname"></div>
        <div class="track"><div id="bossfill"></div></div>
        <div id="bosshint"></div>
      </div>
      <div id="banner"></div>
      <div id="namecard"><div id="nc-name"></div><div id="nc-title"></div></div>

      <div id="title">
        <div class="logo"><span class="small">Revenge of the</span><span class="big">DEMON DRAGON</span></div>
        <div id="title-buttons">
          <button id="btn-continue" type="button" class="menu-btn">Continue</button>
          <button id="btn-new" type="button" class="menu-btn">New Game</button>
        </div>
        <div class="credit">Move: D-pad / arrows &nbsp;·&nbsp; A sword &nbsp;·&nbsp; B bolt &nbsp;·&nbsp; C dodge</div>
      </div>

      <div id="namebox">
        <div class="panel">
          <div class="q">What is your name, knight?</div>
          <input id="name-input" type="text" maxlength="12" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Knight">
          <button id="name-ok" type="button" class="menu-btn">That is my name</button>
        </div>
      </div>

      <div id="dialog">
        <div id="dname"></div>
        <div id="dtext"></div>
        <div id="dchoices"></div>
        <div id="dnext">▼</div>
      </div>
      <button id="skip" type="button">Skip ▸▸</button>
      <div id="fade"></div>
      <div id="nogl">This game needs WebGL, which this browser has switched off or does not support.</div>
    </div>

    <div id="deck">
      <div id="pad" aria-label="Direction pad">
        <span class="arrow up">▲</span><span class="arrow down">▼</span><span class="arrow left">◀</span><span class="arrow right">▶</span>
        <span class="hub"></span>
      </div>
      <div id="keys-hint">Arrows / WASD move<br>Z or J sword · X or K bolt<br>C, L or Space dodge · Q relic</div>
      <div id="buttons">
        <button id="btnC" type="button" class="act c">C<small>dodge</small></button>
        <button id="btnB" type="button" class="act b">B<small>bolt</small></button>
        <button id="btnA" type="button" class="act a">A<small>sword</small></button>
      </div>
    </div>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/gfx.js"></script>
  <script src="js/models.js"></script>
  <script src="js/sets.js"></script>
  <script src="js/level.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
