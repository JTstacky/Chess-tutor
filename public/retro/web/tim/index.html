<!doctype html>
<html lang="en">
<head>
  <script src="/tg-profile.js"></script>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>The Incredible Machine</title>
  <script type="module" crossorigin src="../../assets/web-tim-Bi7CG8sK.js"></script>
  <link rel="modulepreload" crossorigin href="../../assets/modulepreload-polyfill-P2Xu9kJm.js">
  <link rel="modulepreload" crossorigin href="../../assets/saves-CNVK96x1.js">
  <link rel="stylesheet" crossorigin href="../../assets/web-tim-CEnplW19.css">
<style>.tg-back{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;margin:4px;box-sizing:border-box;border:1px solid #b9a8ef;border-radius:10px;background:#29203e;color:#fff!important;font:600 15px/1.3 system-ui,sans-serif;text-decoration:none;touch-action:manipulation}.tg-back:focus-visible{outline:3px solid #ffce54;outline-offset:2px}</style>
</head>
<body>
  <main id="app" data-screen="loading">
    <section id="loading"><a class="tg-back" href="/#retro-classics">&#8592; Back to games</a>
      <h1>The Incredible Machine</h1>
      <p id="load-status" role="status">Loading game files...</p>
    </section>
    <section id="game">
      <div id="stage"><canvas id="screen" width="640" height="448" oncontextmenu="event.preventDefault()"></canvas></div>
      <nav id="controls" aria-label="Machine controls"><a class="tg-back" href="/#retro-classics">&#8592; Back to games</a>
        <button type="button" data-action="run" title="Start or stop the machine (Space)">Start</button>
        <button type="button" data-action="flip" title="Flip the part (F or right click)">Flip</button>
        <button type="button" data-action="smaller" title="Make an incline narrower ([)">− Size</button>
        <button type="button" data-action="larger" title="Make an incline wider (])">+ Size</button>
        <button type="button" data-action="remove" title="Put the part back in the bin (Delete)">Remove</button>
        <button type="button" data-action="menu" title="Control panel (Esc)">Menu</button>
      </nav>
    </section>
    <input id="password" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="16" aria-label="Password">
  </main>
</body>
</html>
