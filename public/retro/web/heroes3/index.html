<!doctype html>
<html lang="en"><head><script src="/tg-profile.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8"><title>Heroes III</title><link rel="stylesheet" href="./style.css"><script src="/tg-invite.js" defer></script><script type="module" src="./main.js"></script></head>
<body><main>
<header><p class="back"><a href="/#retro-classics">← Back to games</a></p><h1>Heroes III</h1><p>Heroes of Might and Magic III Complete</p></header>
<section id="setup" aria-label="Loading Heroes III">
<div id="loading-card"><div id="status" role="status">Loading Heroes III…</div>
<progress id="progress" max="1" value="0" hidden></progress><p id="progress-text" aria-live="polite"></p>
<button id="private-store" type="button" hidden>Try again</button><button id="launch" type="button" hidden>Play</button></div>
<div id="online" aria-label="Play with friends"></div>
<div hidden><p id="data-note"></p><p id="engine-status"></p><input id="files-input" type="file" multiple aria-hidden="true" tabindex="-1">
<input id="save-input" type="file" accept=".vsgm1"><button id="refresh-saves" type="button"></button><p id="save-status"></p><ul id="save-list"></ul>
<button id="forget" type="button"></button><label id="forget-saves-wrap"><input id="forget-saves" type="checkbox"></label></div></section>
<section id="game" hidden aria-label="Game"><div id="rotate-hint">For more room, turn your phone sideways.</div><div id="canvas-wrap"><canvas id="canvas" width="1024" height="768" tabindex="0" aria-label="Heroes III game"></canvas><p id="loading-status" role="status" aria-live="polite"></p></div><div id="online-turn"></div><button id="controls-toggle" type="button" aria-label="Show game controls">Controls</button><nav id="touch-bar" aria-label="Game controls"></nav></section>
<footer><p>Original game © New World Computing / Ubisoft. Engine: the open-source <a href="https://github.com/vcmi/vcmi">VCMI</a>, licensed under <a href="https://www.gnu.org/licenses/gpl-3.0.html">GPL-3.0</a>. <a href="./source/">Source code</a>.</p></footer>
</main></body></html>
